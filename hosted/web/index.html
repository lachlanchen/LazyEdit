<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LazyEdit Studio</title>
<style>body{font:17px system-ui;background:#f3f5fa;color:#18233b;margin:0;padding:9vh 24px}main{max-width:460px;margin:auto;background:white;padding:32px;border-radius:22px;box-shadow:0 16px 70px #24355210}h1{font-size:32px}p{line-height:1.5;color:#526079}input,button{font:inherit;box-sizing:border-box;padding:13px;margin:8px 0;width:100%;border:1px solid #d4dae6;border-radius:10px}button{background:#264ee4;color:white;border:0;cursor:pointer}label{display:block}small{color:#526079}#status{white-space:pre-wrap}</style>
<main><small>LAZYEDIT STUDIO</small><h1>Your creative workspace.</h1><p>Edit videos, connect your platform accounts, and publish from one place.</p>
<form id="login"><label>Username<input name="username" autocomplete="username" required maxlength="32"></label><label>Password<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><button>Sign in</button></form>
<details id="signup"><summary>Have an invitation?</summary><form id="register"><input name="invitation" placeholder="Invitation code" required autocomplete="off"><input name="username" placeholder="Choose a username" autocomplete="username" required pattern="[a-z][a-z0-9_-]{2,31}"><input name="password" placeholder="Password (at least 12 characters)" type="password" autocomplete="new-password" required minlength="12" maxlength="128"><button>Create workspace</button></form></details>
<section id="account" hidden><p id="who"></p><button id="enter">Open Studio</button><button id="logout">Sign out</button></section><p id="status" role="status"></p></main><script src="/index.js" defer></script></html>
